<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Cause:wght@100..900&family=Chango&family=Coiny&family=Walter+Turncoat&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="painelLogin.css">
    <link rel="shortcut icon" href="/sprites/favicon.png" type="image/x-icon">
</head>

<body>
    <nav>
        <a id="logobtn" href="#home"><img src="/sprites/favicon.png" id="logo"></a>
        <div id="dropdownContainer">
            <button id="dropdownTrigger">
                <img src="./sprites/userPng.png" alt="Dropdown Trigger">
            </button>

            <div id="dropdownMenu">
                <a href="painelLogin.html">Login</a>
                <a href="painelRegistro.html">Registrar</a>
            </div>
        </div>
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                const dropdownTrigger = document.getElementById('dropdownTrigger');
                const dropdownMenu = document.getElementById('dropdownMenu');

                dropdownTrigger.addEventListener('click', function (event) {
                    event.stopPropagation();

                    dropdownMenu.classList.toggle('open');
                });

                document.addEventListener('click', function (event) {
                    if (!document.getElementById('dropdownContainer').contains(event.target)) {
                        dropdownMenu.classList.remove('open');
                    }
                });
            });
        </script>
        <ul>
            <a href="index.html#home">
                <li>Home</li>
            </a>
            <a href="index.html#sobre">
                <li>Sobre</li>
            </a>
            <a href="index.html#cardapio">
                <li>Cardápio</li>
            </a>
            <a href="">
                <li>Mural</li>
            </a>
            <a href="">
                <li>Contato</li>
            </a>
        </ul>
    </nav>
    <div id="container">
        <form id="formLogin">
            <h3>Login</h3>
            <input type="text" placeholder="Nome de usuário" id="usuario">
            <input type="text" placeholder="Email" id="email">
            <input type="password" placeholder="Senha" id="senha">
            <button type="submit"> Fazer login </button>
        </form>

        <p id="mensagemLogin"></p>

        <script>
            const formLogin = document.getElementById("formLogin");

            formLogin.addEventListener("submit", async function (event) {
                event.preventDefault();

                const user = document.getElementById("usuario").value.trim();
                const email = document.getElementById("email").value.trim();
                const password = document.getElementById("senha").value;
                const mensagem = document.getElementById("mensagemLogin");

                mensagem.textContent = "Verificando login...";

                try {
                    const resposta = await fetch(
                        "https://shy-moon-2b8e.00001112422687sp.workers.dev/login",
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({ user, email, password })
                        }
                    );

                    const dados = await resposta.json();

                    if (!resposta.ok) {
                        mensagem.textContent = dados.erro || "Falha no login.";
                        return;
                    }

                    mensagem.textContent = `Bem-vindo, ${dados.usuario.user}!`;
                    console.log("Login confirmado:", dados.usuario);

                } catch (erro) {
                    console.error(erro);
                    mensagem.textContent = "Não foi possível conectar ao servidor.";
                }
            });
        </script>
    </div>
</body>

</html>
